<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Krishna Karki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        <div class="brand">
            <img src="profile_1 (1).jpg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'" alt="Krishna">
            <h1>KRISHNA KUMAR KARKI</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="cv.html">CV</a>
            <a href="portfolio.html">Portfolio</a>

            <a href="contact.html" class="active">Contact</a>
        </nav>
    </div>

    <div class="container" style="max-width: 600px;">
        <h1 style="color: var(--navy);">✉️ Send Me a Message</h1>

        <form action="https://formspree.io/f/karki.kris1998@gmail.com" method="POST" style="background: white; padding: 25px; border-radius: 8px; border: 1px solid var(--border);">
            <div class="form-group">
                <label>Name*</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Email*</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Subject*</label>
                <input type="text" name="subject" required>
            </div>
            <div class="form-group">
                <label>Message*</label>
                <textarea name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Submit Message</button>
        </form>
    </div>

    <div class="footer">
        <span>© 2026 Krishna Kumar Karki</span>
        <a href="https://www.linkedin.com/in/krishna-kumar-karki/" target="_blank"><span class="footer-icon in-bg">in</span> LinkedIn</a>
